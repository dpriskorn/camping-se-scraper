[tool.poetry]
name = "camping.se_scraper"
version = "0.1.0"
description = "A web scraper for extracting camping site links using requests and BeautifulSoup."
authors = ["Your Name <your.email@example.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.2"
lxml = "^5.2.0"
pydantic = "^2.9.2"
geopandas = "^1.0.1"
tqdm = "^4.66.5"
aiohttp = "^3.10.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2"
pytest-cov = "^5.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
